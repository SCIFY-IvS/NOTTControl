<html><head><style>body{margin:0;font:14px Arial;color:#20252b}.surface{width:1280px;transform-origin:top left}.nav{height:110px;display:flex;gap:15px;padding:8px 20px;box-sizing:border-box;background:#e8ebed}.host{width:110px;height:90px}.tchmi-button{width:100px;height:80px;margin:4px 5px;background:#f3f5f6;color:#20252b;box-sizing:border-box;border:1px solid #8f989d;display:flex;align-items:end;justify-content:center;text-align:center;padding:6px}.tchmi-button.down{background:#c5d5df}.band{position:relative;border-bottom:1px solid #ddd}.band>div{position:absolute;box-sizing:border-box}.led{background:#23a347;border:1px solid #526059}.ledlabel{display:flex;align-items:center}/* Scope status colors to the three monitored navigation controls only. */
.nott-status-active .tchmi-button {
    background: #287a3d !important;
    color: #ffffff !important;
}
.nott-status-alarm .tchmi-button {
    background: #b3272d !important;
    color: #ffffff !important;
}
.nott-status-active .tchmi-button-template-content-text,
.nott-status-alarm .tchmi-button-template-content-text {
    color: #ffffff !important;
}
</style></head><body><div class="surface"><div class="nav"><div class="host" id="Header_NavigationButton_ThermalBox"><div class="tchmi-button down"><span class="tchmi-button-template-content-text">Thermal Box</span></div></div><div class="host" id="Header_NavigationButton_Events"><div class="tchmi-button down"><span class="tchmi-button-template-content-text">Events</span></div></div><div class="host" id="Header_NavigationButton_DetectorPower"><div class="tchmi-button down"><span class="tchmi-button-template-content-text">Detector Power</span></div></div></div><div class="band" style="height:70px"><span style="position:absolute;left:20px;top:35px">Thermal Box</span><div class="led" style="left:20px;top:8px;width:20px;height:20px"></div><div class="ledlabel" style="left:48px;top:8px;width:110px;height:20px">Enabled</div></div><div class="band" style="height:50px"><span style="position:absolute;left:20px;top:35px"></span><div class="led" style="left:265px;top:15px;width:20px;height:20px"></div><div class="ledlabel" style="left:293px;top:15px;width:110px;height:20px">Power enabled</div></div></div><script>
window.subscriptions=[];const controls={};for(const name of ['ThermalBox','Events','DetectorPower']){const id='Header_NavigationButton_'+name,el=document.getElementById(id);controls[name]={getId:()=>id,getElement:()=>({toggleClass:(c,b)=>el.classList.toggle(c,!!b)}),setTooltip:s=>el.title=s};}
const root={getId:()=> 'Header',getChildren:()=>Object.values(controls)};
const TcHmi={Errors:{NONE:0},Controls:{get:()=>root},Functions:{registerFunctionEx(){}},EventProvider:{register:()=>()=>{}},Server:{Events:{Type:{Alarm:1},ConfirmationState:{WaitForConfirmation:2}},subscribeEx:(commands,interval,opts,callback)=>{subscriptions.push({commands,callback});return 1;},unsubscribeEx(){}}};
(function (TcHmi) {
    'use strict';
    var sessions = new WeakMap();
    var thermal = 'ADS.NOTT_CRYO_PLC.MAIN.nott_cryo_ctrl.thermal_box_ctrl.stat';
    var detector = 'ADS.NOTT_CRYO_PLC.MAIN.nott_detector_power.stat';
    var fuse = 'ADS.NOTT_CRYO_PLC.MAIN.nott_detector_power.fuseDetectorPower';
    var faults = ['bTripped', 'bShortCircuit', 'bOverload', 'bHardwareProtection',
        'bOvervoltage', 'bUndervoltage', 'bError', 'bTxPDOState'];
    function find(root, suffix) {
        if (root.getId().endsWith(suffix)) return root;
        var children = root.getChildren ? root.getChildren() : [];
        for (var i = 0; i < children.length; i++) {
            var result = find(children[i], suffix);
            if (result) return result;
        }
        return null;
    }
    function paint(control, active, alarm, known, label) {
        if (!control) return;
        var element = control.getElement();
        element.toggleClass('nott-status-alarm', alarm === true);
        element.toggleClass('nott-status-active', alarm !== true && known && active === true);
        if (control.setTooltip) control.setTooltip(label + (alarm === true ? ': alarm' :
            !known ? ': status unavailable' : active ? ': enabled' : ': disabled'));
    }
    function update(session) {
        var t = session.values[thermal], d = session.values[detector];
        var bits = session.values[fuse + '.i_stStatus'], f = session.values[fuse + '.stat'];
        var fuseAlarm = bits && faults.some(function (name) { return bits[name] === true; });
        var detectorAlarm = !!((d && d.bAlarm === true) || fuseAlarm ||
            (f && typeof f.nErrorCode === 'number' && f.nErrorCode !== 0));
        paint(find(session.root, '_NavigationButton_ThermalBox'), t && t.bActive,
            t && t.bAlarm, !!t, 'Thermal box');
        paint(find(session.root, '_NavigationButton_DetectorPower'), d && d.bPowerOn,
            detectorAlarm, !!(d && bits && f && d.bFuseOperational === true), 'Detector power');
        var events = find(session.root, '_NavigationButton_Events');
        paint(events, false,
            session.unconfirmed > 0, session.unconfirmed !== null, 'Unconfirmed alarms');
        if (events && events.setTooltip && session.unconfirmed !== null)
            events.setTooltip('Unconfirmed alarms: ' + session.unconfirmed);
    }
    function clear(session) {
        session.values = {};
        session.unconfirmed = null;
        update(session);
    }
    function subscribe(session) {
        var commands = [thermal, detector, fuse + '.i_stStatus', fuse + '.stat'].map(function (symbol) {
            return {symbol: symbol, commandOptions: ['SendErrorMessage']};
        });
        // Same count-only query used by the installed EventGrid's Confirm All control.
        commands.push({symbol: 'ListEvents', commandOptions: ['SendErrorMessage'], limit: 0,
            filter: [{path: 'type', comparator: '==', value: TcHmi.Server.Events.Type.Alarm},
                {logic: 'AND'}, {path: 'confirmationState', comparator: '==',
                    value: TcHmi.Server.Events.ConfirmationState.WaitForConfirmation}]});
        session.subscription = TcHmi.Server.subscribeEx(commands, 1000, null, function (data) {
            if (sessions.get(session.root) !== session) return;
            if (data.error !== TcHmi.Errors.NONE || !data.response || data.response.error ||
                !Array.isArray(data.response.commands)) {
                clear(session); return;
            }
            (data.response.commands || []).forEach(function (command) {
                if (command.symbol === 'ListEvents') {
                    session.unconfirmed = !command.error && typeof command.maxEntries === 'number' ?
                        command.maxEntries : null;
                } else if (command.error || !command.readValue || typeof command.readValue !== 'object') {
                    delete session.values[command.symbol];
                } else session.values[command.symbol] = command.readValue;
            });
            update(session);
        });
    }
    function stop(root) {
        var previous = sessions.get(root);
        if (!previous) return;
        sessions.delete(root);
        previous.disconnect();
        previous.reconnect();
        if (previous.subscription !== null) TcHmi.Server.unsubscribeEx(previous.subscription, null);
        clear(previous);
    }
    function NOTTHeaderStatus(ownerId, action) {
        var root = TcHmi.Controls.get(ownerId);
        if (!root) return;
        stop(root);
        if (action !== 'Attach' || (typeof TCHMI_DESIGNER !== 'undefined' && TCHMI_DESIGNER)) return;
        var session = {root: root, values: {}, unconfirmed: null, subscription: null,
            disconnect: function () {}, reconnect: function () {}};
        sessions.set(root, session);
        session.disconnect = TcHmi.EventProvider.register('onServerNotReady', function () { clear(session); });
        session.reconnect = TcHmi.EventProvider.register('onServerReady', function () {
            if (sessions.get(root) !== session) return;
            if (session.subscription !== null) TcHmi.Server.unsubscribeEx(session.subscription, null);
            clear(session);
            subscribe(session);
        });
        clear(session);
        subscribe(session);
    }
    TcHmi.Functions.NOTT = TcHmi.Functions.NOTT || {};
    TcHmi.Functions.NOTT.NOTTHeaderStatus = NOTTHeaderStatus;
    TcHmi.Functions.registerFunctionEx('NOTTHeaderStatus', 'TcHmi.Functions.NOTT', NOTTHeaderStatus);
})(TcHmi);

TcHmi.Functions.NOTT.NOTTHeaderStatus('Header','Attach');
window.showState=(alarm,active,count)=>{const s=subscriptions[0],names=s.commands.map(c=>c.symbol);s.callback({error:0,response:{commands:[{symbol:names[0],readValue:{bActive:active,bAlarm:alarm}},{symbol:names[1],readValue:{bPowerOn:active,bAlarm:alarm,bFuseOperational:true}},{symbol:names[2],readValue:{bTripped:alarm}},{symbol:names[3],readValue:{nErrorCode:0}},{symbol:'ListEvents',maxEntries:count}]}});document.querySelectorAll('.led').forEach(l=>l.style.background=active?'#23a347':'#a7acaf');};
document.querySelector('.surface').style.transform='scale('+Math.min(1,innerWidth/1280)+')';</script></body></html>
