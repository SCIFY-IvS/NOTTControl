# MACIE / MSAC GigE needs a large SO_RCVBUF (~134217 KB ≈ 128 MiB).
# Kernel doubles SO_RCVBUF for bookkeeping, so rmem_max must be >= 256 MiB.
# Copy to /etc/sysctl.d/99-macie-gige.conf then: sudo sysctl --system
net.core.rmem_max = 268435456
net.core.rmem_default = 134217728
net.core.wmem_max = 268435456
net.core.wmem_default = 134217728
net.core.netdev_max_backlog = 50000
