# H2RG slow-mode config with Teledyne acceptance biases (cold ASIC).
#
# Pair with HxRG_Teledyne.mcd / HxRG_Teledyne.cfg. Cold clock phase and
# per-frame preamp reset. Reference inputs: differential (not shorted/grounded).

MACIEFile   load_files/MACIE_Registers_Slow.mrf
MACIEslot   2
ASICFile    load_files/mcd/HxRG_Teledyne.mcd
ASICRegs    load_files/cfg/HxRG_Teledyne.cfg

saveDir     /data/nott
filePrefix  nott

DetType     H2RG  # H1RG, H2RG, H4RG
DetMode     SLOW  # SLOW or FAST

clkRateM    10       # Master clock (MHz)
clkPhase    0x01ea   # 0x01ea - Cold; 0x01ca - Warm

reg_NumOutputs      32
reg_RefInput        1       # 0 - single-ended (0x4a0a)  1 - differential (0x4502)
reg_RefOverride     0       # 0 - use RefInput routing  1 - use OverrideVals (e.g. 0xaaaa shorted)

reg_Buff            0x0     # Unbuffered 0x0, buffered 0x3
reg_Gain            8       # PreAmp gain 0-15 (matches MSAC ASICGAIN=8)
reg_CapComp         19
reg_FiltPole        5

reg_WarmOrCold      0       # 0 - Cold  1 - Warm
reg_PreampRstScheme 0       # 0 - per frame (cold)  1 - per row (warm)
reg_KtcRemove       0       # 0 - No kTC removal; 0x4016 must be 0x0000
reg_PixelRstScheme  0       # 0 - Line/Pixel  1 - Global
reg_NumResets       1       # One reset read at ramp start (MCD 4000)
reg_SaveRstFrames   0       # bit0 of 0x4002: omit reset plane from FITS cube
reg_ClkSCADrop      1       # bit2 of 0x4002: clock SCA during drops
reg_IdleMode        0       # 0 - Do Nothing; 0x4002 must be 0x0005 (not 0x000c/0x000d)

# Readout mode — Init/LoadASIC defaults to 1 group × 1 read and MCD WinMode;
# MSAC "Set configuration" latches these. Without them, full-frame GigE can
# desync (~65535 ADU) until Set is clicked.
reg_WinMode         0       # 0 - Full frame   1 - Window (h4018 bit1)
reg_PixelClkScheme  1       # 1 - Enhanced (cold full-frame science; h4017 bit0)
reg_ExpMode         0       # 0 - Up-the-ramp / CDS   1 - Fowler (h4018 bit0)
reg_NumGroups       1       # CDS: one group
reg_NumReads        2       # CDS: correlated pair (LoadASIC leaves 1 read)
reg_NumDrops        0

reg_VReset1         0x8080  # 0.25 V
reg_DSub1           0x8100  # 0.50 V
reg_VBiasGate1      0xb567  # 2.00 V (lab-stable; Teledyne target 2.30 V / 0xb600)
reg_CellDrain1      0x8005  # ~0.010 V (MCD 0x8000 is 0.00 V)
reg_Drain1          0x8005  # ~0.010 V (MCD 0x8000 is 0.00 V)
reg_VRefMain        0x8400  # SIDECAR ref bias; 8334 gave all-zero MSAC reset frames
