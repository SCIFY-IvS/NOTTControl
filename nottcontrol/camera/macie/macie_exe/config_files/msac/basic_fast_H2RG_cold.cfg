# MSAC-only fast-mode config (NOTT GUI uses ../basic_fast_H2RG_cold.cfg → /data/nott).
#
# Deploy to MSAC LoadFiles/msac/ and load from MSAC — not via zmq_server / H2RG GUI.
# Uses Teledyne DevBrd 12-bit / 32-output / 5 MHz cold ASIC MCD.

MACIEFile   load_files/MACIE_Registers_Fast_Cryo.mrf
MACIEslot   2
ASICFile    load_files/mcd/DevBrd_H2RG_12bit_32output_5MHz_coldASIC.mcd
ASICRegs    load_files/cfg/H2RG_12bit_32output_5MHz_coldASIC.cfg

saveDir     /data/bench_data/H2RG_ASIC
filePrefix  nott

DetType     H2RG  # H1RG, H2RG, H4RG
DetMode     FAST  # SLOW or FAST

# Master clock / phase (FAST defaults to 80 MHz; cold phase for cryo ASIC)
clkRateM    80
clkPhase    0x01ea   # 0x01ea - Cold; 0x01ca - Warm

# Applied after ASIC download (overrides ASIC_Defaults for fast).
# 0xaaaa = shorted/grounded refs (common MSAC fast setup).
Inputs      0xaaaa
Gain        8
CapComp     38
FiltPole    5
