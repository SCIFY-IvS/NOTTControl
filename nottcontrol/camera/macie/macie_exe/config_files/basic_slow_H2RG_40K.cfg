# NOTT H2RG slow-mode config for cryogenic operation (~40 K detector temperature).
#
# Pair with HxRG_Main.mcd (cold microcode / bias table). There is no separate
# Teledyne 40 K .mcd in this repo; verify detector temperature on the cryo
# system and tune detector biases in MSAC if the dark pedestal is abnormal.
#
# ASIC clocking: cold phase and per-frame preamp reset (not 80 K warm / per-row).
# Reference inputs: differential with shorted/grounded override (0xaaaa).

MACIEFile   load_files/MACIE_Registers_Slow.mrf
MACIEslot   2
ASICFile    load_files/mcd/HxRG_Main.mcd
ASICRegs    load_files/cfg/HxRG_Main.cfg

saveDir     ~/test_data/40K/slow_mode/
filePrefix  H2RG_Slow_40K

DetType     H2RG  # H1RG, H2RG, H4RG
DetMode     SLOW  # SLOW or FAST

clkRateM    10
clkPhase    0x01ea   # 0x01ea - Cold; 0x01ca - Warm (~80 K)

# Register values applied after microcode load (see HxRG_Main.cfg)
reg_NumOutputs      32
reg_RefInput        1       # 0 - single-ended  1 - differential (V4,V3,V2,V1)
reg_RefOverride     1       # Use OverrideVals for ref inputs
reg_OverrideVals    0xaaaa  # Shorted / grounded differential inputs

reg_Buff            0x0     # Unbuffered 0x0, buffered 0x3
reg_Gain            8       # PreAmp gain 0-15; try 12 if dark level is very low
reg_CapComp         19      # 19 => 19*53 = 1007 fF
reg_FiltPole        5       # 5 => ~1263 kHz (4.2 x 300 kHz)

reg_WarmOrCold      0       # 0 - Cold (~37-40 K)  1 - Warm (~80 K)
reg_PreampRstScheme 0       # 0 - per frame (cold)  1 - per row (warm)
