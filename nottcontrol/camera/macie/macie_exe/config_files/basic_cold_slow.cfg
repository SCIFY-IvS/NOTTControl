# NOTT H2RG slow-mode config for cryogenic (cold ASIC) operation.
#
# Pair with HxRG_Main.mcd / HxRG_Main.cfg. Uses cold clock phase and per-frame
# preamp reset. Reference inputs: differential with shorted/grounded override.

MACIEFile   load_files/MACIE_Registers_Slow.mrf
MACIEslot   2
ASICFile    load_files/mcd/HxRG_Main.mcd
ASICRegs    load_files/cfg/HxRG_Main.cfg

saveDir     ~/test_data/slow_mode/ramp_test
filePrefix  H2RG_Slow_Cold

DetType     H2RG  # H1RG, H2RG, H4RG
DetMode     SLOW  # SLOW or FAST

clkRateM    10       # Master clock (MHz)
clkPhase    0x01ea   # 0x01ea - Cold; 0x01ca - Warm

reg_NumOutputs      32
reg_RefInput        1       # 0 - single-ended  1 - differential
reg_RefOverride     1
reg_OverrideVals    0xaaaa  # Shorted / grounded inputs

reg_Buff            0x0     # Unbuffered 0x0, buffered 0x3
reg_Gain            8       # PreAmp gain 0-15 (Main.mcd default)
reg_CapComp         19
reg_FiltPole        5

reg_WarmOrCold      0       # 0 - Cold  1 - Warm (~80 K)
reg_PreampRstScheme 0       # 0 - per frame (cold)  1 - per row (warm)
