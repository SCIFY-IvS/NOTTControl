[build-system]
requires = [
    "setuptools >= 40.6.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["nottcontrol/"]
include = ["nottcontrol"]

[project]
name = "nottcontrol"
version = "0.0"
description = "Software package for the high level control of the NOTT instrument"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = [
  "PyQt5",
  "asyncua",
  "pyqtgraph",
  "numpy",
  "scipy",
  "opencv-python-headless",
  "redis",
  "pyzmq",
  "sympy",
  "matplotlib",
  "astropy>=5.0",
  # Required by main GUI import chain: scifygui → piezos_window → pypiezo.
  "pyserial",
]

[project.optional-dependencies]
macos = ["pyobjc-framework-Cocoa"]
# script/calibration/kappa_matrix*.py
calibration = ["scikit-learn"]
# lucid camera utils + components.correctors fitting (backend / HumInt paths)
lucid = ["lmfit"]
